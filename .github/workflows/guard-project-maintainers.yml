name: Guard project-maintainers-.project.csv

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "project-maintainers-.project.csv"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  close-and-redirect:
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(cat <<'EOF'
          👋 Thanks for the PR! `project-maintainers-.project.csv` in this repo is **auto-generated** every day from each project's `.project/maintainers.yaml` file. Any direct edits here would be overwritten on the next sync, so this PR is being closed automatically.

          **To update maintainer information for your project:**

          1. Edit `maintainers.yaml` in **your project's own `.project` repository** and open a PR there. For a multi-project repository, edit the file in the relevant project directory.
          2. Once merged, the change flows into this file on the next daily sync.

          **Keep other records current:**

          The generated list gets names and affiliations from each maintainer's LFID profile at <https://openprofile.dev>. Keep affiliation details in the project's public maintainer or governance documentation current too. These records are separate from `.project/maintainers.yaml`.

          Access to CNCF Service Desk and project maintainer mailing lists is controlled through the maintainer's GitHub handle in the project's `maintainers.yaml` and their LFID profile information. Keep the linked GitHub handle and primary email address current in the profile.

          Questions? Contact CNCF staff.
          EOF
          )"

          gh pr close "$PR_NUMBER" --repo "$REPO"
