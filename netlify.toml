[build]
  base = "license-exceptions/"
  command = "node scripts/generate-all.js && mkdir -p _site && cp -r site/* _site/ && cp exceptions.json CNCF-licensing-exceptions.csv cncf-exceptions-current.spdx _site/"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/blanket-exceptions.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/exceptions.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/CNCF-licensing-exceptions.csv"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/cncf-exceptions-current.spdx"
  [headers.values]
    Access-Control-Allow-Origin = "*"
